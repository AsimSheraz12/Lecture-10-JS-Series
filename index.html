<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" >
    <title>Rock-Paper-Scissor-GAme</title>
</head>
<body>
    <h1>Rock Paper Scissor Game</h1>
    <div class="choices" >
        <div class="choice" id="rock">
            <img src="Rock.jpg">
        </div>
        <div class="choice" id="paper">
            <img src="Paper.jpg">
        </div>
        <div class="choice" id="scissor">
            <img src="Scissor.jpg">
        </div>
    </div>
    <div class="scoreBoard">
        <div class="score">
            <p id="userScore">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="compScore">0</p>
            <p>Comp</p>
        </div>
        <div class="score">
            <p id="draw">0</p>
            <p>Draw</p>
        </div>
        <div class="score">
            <p id="total">0</p>
            <p>Total</p>
        </div>
    </div>
        <p id="mesContainer">Choose Your Move</p>
    <br>
    <button>Mode Change</button>
    <script src="game-Logic.js"></script>
</body>
</html>
